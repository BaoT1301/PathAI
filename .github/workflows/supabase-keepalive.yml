name: Supabase Keep-Alive

# Supabase free-tier projects pause after 7 days of inactivity.
# This workflow makes a lightweight DB query on a schedule so the
# inactivity timer keeps resetting and the project never pauses.

on:
  schedule:
    # Runs every 3 days at 09:00 UTC (well inside the 7-day window,
    # with margin for GitHub's cron delays / skipped runs).
    - cron: "0 9 */3 * *"
  # Allow manual runs from the Actions tab for testing.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (query jobs table via PostgREST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $SUPABASE_URL ..."
          # PostgREST request -> hits the Postgres DB -> counts as activity.
          # head=true returns no rows, just headers; limit=1 keeps it tiny.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Range: 0-0")
          echo "HTTP status: $STATUS"
          # 200/206 = success; anything else fails the run so you get notified.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "::error::Unexpected status $STATUS — Supabase may be paused, deleted, or misconfigured."
            exit 1
          fi
          echo "Supabase is alive."
